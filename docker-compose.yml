services:
  app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    container_name: node-app
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command:
      npm run start:dev
      

  database:
    image: postgres:13
    container_name: postgres-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
